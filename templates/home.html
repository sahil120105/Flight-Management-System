<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Flight Management System</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
    <div class="container">
        <div class="jumbotron text-center bg-white shadow mt-5">
            <h1 class="display-4 text-primary">Welcome to BookMyFlight</h1>
            <p class="lead">Book your flights easily and manage your bookings with us.</p>
            <hr class="my-4">
            <p>Get started by signing up, logging in as a user, or continue as an admin.</p>
            
            <!-- Buttons -->
            <a class="btn btn-primary btn-lg mr-2" href="{{ url_for('signup') }}" role="button">
                <i class="bi bi-person-plus-fill mr-1"></i> Sign Up
            </a>
            <a class="btn btn-secondary btn-lg mr-2" href="{{ url_for('login') }}" role="button">
                <i class="bi bi-box-arrow-in-right mr-1"></i> Login
            </a>
            <a class="btn btn-outline-dark btn-lg" href="{{ url_for('admin_login') }}" role="button">
                <i class="bi bi-person-gear mr-1"></i> Admin Login
            </a>
        </div>
    </div>
</body>
</html>
